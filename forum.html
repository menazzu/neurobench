<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeuroBench | Форум</title>
    <meta name="description" content="Форум сообщества NeuroBench — обсуждение ИИ, генерации и бенчмарков.">

    <link rel="stylesheet" href="css/tailwind.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

    <link rel="icon" type="image/png" href="logo2.png">
    <link rel="stylesheet" href="css/style.css?v=24">
</head>
<body class="antialiased min-h-screen flex flex-col">

    <canvas id="ascii-canvas"></canvas>

    <div id="navbar-placeholder"></div>
    <script src="js/navbar.js"></script>

    <section class="py-32 px-6 max-w-4xl mx-auto relative z-10 text-white font-mono">
        <div id="forum-main">
            <div class="forum-loading">Загрузка...</div>
        </div>
    </section>

    <div id="forum-modal-overlay" class="fixed inset-0 bg-black/80 z-50 hidden items-center justify-center">
        <div id="forum-modal" class="w-full max-w-lg mx-4 matte-card p-8 custom-scrollbar max-h-[85vh] overflow-y-auto"></div>
    </div>

    <script src="js/config.js?v=4"></script>
    <script src="js/api.js?v=4"></script>
    <script src="js/main.js?v=4"></script>
    <script src="js/forum.js"></script>
    <script>
        const canvas = document.getElementById('ascii-canvas');
        const ctx = canvas.getContext('2d');
        let width, height, columns, rows;
        const isMobile = window.innerWidth < 768;
        const fontSize = isMobile ? 24 : 15;
        const chars = " .:-=+*#%@".split("");
        let pageHidden = false;
        document.addEventListener('visibilitychange', () => { pageHidden = document.hidden; });

        function init() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            columns = Math.ceil(width / fontSize);
            rows = Math.ceil(height / fontSize);
        }

        let mouse = { x: -1000, y: -1000 };
        const trail = [];
        const TRAIL_MAX_AGE = 2000;
        const TRAIL_RADIUS = 130;
        const TRAIL_SAMPLE_DIST = 10;

        function pushTrail(px, py) {
            const last = trail[trail.length - 1];
            if (!last || Math.hypot(px - last.x, py - last.y) > TRAIL_SAMPLE_DIST) {
                trail.push({ x: px, y: py, t: performance.now() });
            }
        }
        window.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; pushTrail(e.clientX, e.clientY); });
        window.addEventListener('touchmove', e => { const t = e.touches[0]; if (t) { mouse.x = t.clientX; mouse.y = t.clientY; pushTrail(t.clientX, t.clientY); } }, { passive: true });
        window.addEventListener('touchend', () => { mouse.x = -1000; mouse.y = -1000; });

        if (isMobile) {
            canvas.style.display = 'none';
        } else {
            let rafId;
            let lastFrame = 0;
            const FRAME_INTERVAL = 1000 / 30;
            function drawASCII(time) {
                if (pageHidden) { rafId = requestAnimationFrame(drawASCII); return; }
                const delta = time - lastFrame;
                if (delta < FRAME_INTERVAL) { rafId = requestAnimationFrame(drawASCII); return; }
                lastFrame = time - (delta % FRAME_INTERVAL);
                ctx.fillStyle = '#050505';
                ctx.fillRect(0, 0, width, height);
                ctx.font = fontSize + 'px "Geist Mono"';
                ctx.textAlign = 'center';

                const now = performance.now();
                while (trail.length > 0 && now - trail[0].t > TRAIL_MAX_AGE) trail.shift();

                for (let y = 0; y < rows; y++) {
                    for (let x = 0; x < columns; x++) {
                        const charX = x * fontSize;
                        const charY = y * fontSize;
                        const dist = Math.hypot(charX - mouse.x, charY - mouse.y);
                        const mouseEffect = Math.max(0, 1 - dist / 400);

                        let trailEffect = 0;
                        for (let i = trail.length - 1; i >= 0; i--) {
                            const p = trail[i];
                            const dx = charX - p.x, dy = charY - p.y;
                            if (dx > TRAIL_RADIUS || dx < -TRAIL_RADIUS || dy > TRAIL_RADIUS || dy < -TRAIL_RADIUS) continue;
                            const d = Math.sqrt(dx * dx + dy * dy);
                            if (d < TRAIL_RADIUS) {
                                const spatial = 1 - d / TRAIL_RADIUS;
                                const temporal = 1 - (now - p.t) / TRAIL_MAX_AGE;
                                const e = spatial * spatial * temporal;
                                if (e > trailEffect) trailEffect = e;
                            }
                        }

                        const noise = Math.sin(x * 0.3 + time * 0.0005) * Math.cos(y * 0.3 + time * 0.0005);
                        const combined = mouseEffect * 0.7 + trailEffect * 0.55;
                        const brightness = Math.min(chars.length - 1, Math.floor((noise * 0.5 + 0.5 + combined) * chars.length));
                        ctx.fillStyle = `rgba(255, 255, 255, ${0.03 + mouseEffect * 0.12 + trailEffect * 0.1})`;
                        ctx.fillText(chars[brightness], charX, charY);
                    }
                }
                rafId = requestAnimationFrame(drawASCII);
            }
            init();
            window.addEventListener('resize', init);
            rafId = requestAnimationFrame(drawASCII);
        }
    </script>
</body>
</html>
